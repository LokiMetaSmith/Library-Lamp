<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Hub</title>
<link rel="stylesheet" href="style.css">
<style>
:root {
  --c-notice-fg:  #6b5a3e; --c-notice-bg: #f0e8d8; --c-notice-bar: #a09070;
  --c-offer-fg:   #2d5c2a; --c-offer-bg:  #daeeda; --c-offer-bar:  #5a8a57;
  --c-need-fg:    #7a4a10; --c-need-bg:   #f5e8d0; --c-need-bar:   #c4813a;
  --c-event-fg:   #1e4f70; --c-event-bg:  #d8eaf5; --c-event-bar:  #4a88b0;
  --c-review-fg:  #5c2a4a; --c-review-bg: #eedaea; --c-review-bar: #8a577a;
  --c-recomm-fg:  #2a5c55; --c-recomm-bg: #daeeee; --c-recomm-bar: #578a82;
  --c-request-fg: #4a4a4a; --c-request-bg: #e0e0e0; --c-request-bar: #8a8a8a;

  --shadow: 3px 4px 0 rgba(44,36,22,0.10);
}

body {
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.site-header {
  background: var(--accent-dark);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 3px solid #5a3820;
  flex-wrap: wrap;
}
.header-title-block { flex: 1; min-width: 160px; }
.site-title {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 20px;
  font-weight: bold;
  color: var(--accent-light);
  line-height: 1.2;
}
.site-sub {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--accent);
  margin-top: 2px;
}
.header-meta {
  text-align: right;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 11px;
  color: var(--accent);
  line-height: 1.7;
}

/* ── Post form ── */
.post-form {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 14px 20px;
}

.form-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.field { display: flex; flex-direction: column; gap: 3px; }
.field label {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.field input,
.field textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  padding: 7px 10px;
  outline: none;
  transition: border-color .2s;
}
.field input:focus,
.field textarea:focus { border-color: var(--accent-dark); }
.field-name  { flex: 0 0 160px; }
.field-msg   { flex: 1 1 220px; }
.field textarea { resize: vertical; height: 90px; min-height: 60px; }
.char-hint {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 10px;
  color: var(--ink-muted);
  text-align: right;
  height: 14px;
}
.char-hint.warn { color: var(--c-need-bar); }

/* Category buttons */
.field-cat { flex: 0 0 auto; }
.cat-btns {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  padding-top: 1px;
}
.cat-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink-muted);
  cursor: pointer;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 11px;
  padding: 5px 10px;
  transition: all .15s;
  white-space: nowrap;
}
.cat-btn:hover { border-color: var(--border); color: var(--ink); background: var(--surface2); }
.cat-btn.active-Notice { background: var(--c-notice-bg); border-color: var(--c-notice-bar); color: var(--c-notice-fg); font-weight: bold; }
.cat-btn.active-Offer  { background: var(--c-offer-bg);  border-color: var(--c-offer-bar);  color: var(--c-offer-fg);  font-weight: bold; }
.cat-btn.active-Need   { background: var(--c-need-bg);   border-color: var(--c-need-bar);   color: var(--c-need-fg);   font-weight: bold; }
.cat-btn.active-Event  { background: var(--c-event-bg);  border-color: var(--c-event-bar);  color: var(--c-event-fg);  font-weight: bold; }
.cat-btn.active-Review { background: var(--c-review-bg); border-color: var(--c-review-bar); color: var(--c-review-fg); font-weight: bold; }
.cat-btn.active-Recomm { background: var(--c-recomm-bg); border-color: var(--c-recomm-bar); color: var(--c-recomm-fg); font-weight: bold; }
.cat-btn.active-Request { background: var(--c-request-bg); border-color: var(--c-request-bar); color: var(--c-request-fg); font-weight: bold; }

/* Expiry row */
.expiry-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
  flex-wrap: wrap;
}
.expiry-label {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-right: 2px;
}
.exp-btn {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: 99px;
  color: var(--ink-muted);
  cursor: pointer;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 11px;
  padding: 3px 11px;
  transition: all .15s;
}
.exp-btn:hover  { border-color: var(--border); color: var(--ink); }
.exp-btn.active { background: var(--accent-dark); border-color: var(--accent-dark); color: var(--accent-light); }

.post-btn {
  background: var(--accent-dark);
  border: 2px solid #5a3820;
  border-radius: var(--radius);
  color: var(--accent-light);
  cursor: pointer;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  padding: 8px 20px;
  margin-top: 8px;
  transition: background .15s;
  white-space: nowrap;
  align-self: flex-end;
}
.post-btn:hover { background: #a06b43; }
.post-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── Filter bar ── */
.filter-bar {
  background: var(--surface2);
  border-bottom: 1px solid var(--border-light);
  padding: 9px 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-label {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.sep { flex: 1; }
.ftab {
  background: none;
  border: 1px solid var(--border-light);
  border-radius: 99px;
  color: var(--ink-muted);
  cursor: pointer;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 11px;
  padding: 3px 12px;
  transition: all .15s;
}
.ftab:hover  { border-color: var(--accent-dark); color: var(--accent-dark); }
.ftab.active { background: var(--accent-dark); border-color: var(--accent-dark); color: var(--accent-light); }

/* ── Board ── */
.board {
  flex: 1;
  padding: 16px 20px;
  columns: 3 260px;
  gap: 14px;
}

/* ── Card ── */
.card {
  display: inline-block;
  width: 100%;
  margin-bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  break-inside: avoid;
  overflow: hidden;
  animation: cardIn .2s ease;
}
@keyframes cardIn { from { opacity:0; transform:translateY(5px); } }
.card-stripe { height: 4px; }
.card-body { padding: 11px 13px 9px; }
.cat-badge {
  display: inline-block;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 9px;
  border-radius: 99px;
  margin-bottom: 7px;
}
.card-text { font-size: 14px; line-height: 1.6; color: var(--ink); word-break: break-word; }
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 13px;
  background: var(--surface2);
  border-top: 1px solid var(--border-light);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 11px;
  color: var(--ink-muted);
}
.card-author { font-weight: bold; color: var(--ink); }
.card-expiry { font-size: 10px; }
.card-expiry.soon { color: var(--c-need-bar); }

.type-Notice .card-stripe { background: var(--c-notice-bar); }
.type-Notice .cat-badge   { background: var(--c-notice-bg); color: var(--c-notice-fg); }
.type-Offer  .card-stripe { background: var(--c-offer-bar);  }
.type-Offer  .cat-badge   { background: var(--c-offer-bg);  color: var(--c-offer-fg);  }
.type-Need   .card-stripe { background: var(--c-need-bar);  }
.type-Need   .cat-badge   { background: var(--c-need-bg);   color: var(--c-need-fg);   }
.type-Event  .card-stripe { background: var(--c-event-bar); }
.type-Event  .cat-badge   { background: var(--c-event-bg);  color: var(--c-event-fg);  }
.type-Review .card-stripe { background: var(--c-review-bar);  }
.type-Review .cat-badge   { background: var(--c-review-bg);  color: var(--c-review-fg);  }
.type-Recomm .card-stripe { background: var(--c-recomm-bar);  }
.type-Recomm .cat-badge   { background: var(--c-recomm-bg);   color: var(--c-recomm-fg);   }
.type-Request .card-stripe { background: var(--c-request-bar); }
.type-Request .cat-badge   { background: var(--c-request-bg);  color: var(--c-request-fg);  }

.empty {
  column-span: all;
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-muted);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 2.2;
}

/* ── Footer ── */
.site-footer {
  background: var(--surface2);
  border-top: 1px solid var(--border-light);
  padding: 7px 20px;
  display: flex;
  justify-content: space-between;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 10px;
  color: var(--ink-muted);
}

@media (max-width: 540px) {
  .board { columns: 1; padding: 12px; }
  .form-row { flex-direction: column; }
  .field-name { flex: 1 1 auto; }
  .post-btn { width: 100%; text-align: center; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-menu" style="position: static; margin-right: 10px;">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu" title="Toggle Menu" aria-expanded="false" aria-controls="menuContent" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 4px 8px; font-size: 16px;">☰</button>
      <div class="menu-content" id="menuContent" style="top: 60px;">
          <a href="/">Home (USB Transfer View)</a>
          <a href="/ereader.html">Mobile Download View</a>
          <a href="/audio.html">Audio Radio</a>
          <a href="/board.html">Bulletin Board</a>
          <a href="/about.html">About</a>
      </div>
  </div>
  <div id="systemBanner" aria-live="assertive" style="display:none;background:#ffcc00;color:#333;padding:10px;margin:0 24px 15px 24px;border-radius:5px;border:1px solid #e6b800;">
    <ul id="systemErrorsList" style="margin:0;padding-left:20px;"></ul>
  </div>
  <div class="header-title-block">
    <div class="site-title" id="boardTitle">COMMUNITY HUB</div>
    <div class="site-sub"   id="boardTagline"></div>
  </div>
  <div class="header-meta">
    <div id="boardRules"></div>
    <div id="postCount">— posts</div>
  </div>
</header>
<div id="fullBanner" aria-live="assertive" style="display:none;background:#a30000;color:#fff;
     text-align:center;padding:10px 16px;font-weight:600">
  📋 This board is currently full. Check back once some posts have expired. 📋
</div>
<form class="post-form" novalidate onsubmit="event.preventDefault(); doPost();">
  <div class="form-row">

    <div class="field field-name">
      <label for="nameIn">Your Name</label>
      <input id="nameIn" maxlength="24" placeholder="neighbor"
             autocomplete="off" spellcheck="false">
      <div class="char-hint" id="nameHint" aria-live="polite"></div>
    </div>

    <div class="field field-cat">
      <label id="catLabel">Category</label>
      <div class="cat-btns" role="group" aria-labelledby="catLabel">
        <button type="button" class="cat-btn active-Notice" aria-pressed="true" onclick="setType('Notice',this)">📌 Notice</button>
        <button type="button" class="cat-btn" aria-pressed="false" onclick="setType('Offer', this)">🌱 Offer</button>
        <button type="button" class="cat-btn" aria-pressed="false" onclick="setType('Need',  this)">🤝 Need</button>
        <button type="button" class="cat-btn" aria-pressed="false" onclick="setType('Event', this)">📅 Event</button>
        <button type="button" class="cat-btn" aria-pressed="false" onclick="setType('Review', this)">📖 Review</button>
        <button type="button" class="cat-btn" aria-pressed="false" onclick="setType('Recomm',  this)">💡 Recomm.</button>
        <button type="button" class="cat-btn" aria-pressed="false" onclick="setType('Request', this)">🔍 Request</button>
      </div>
      <div class="char-hint"></div>
    </div>

    <div class="field field-msg">
      <label for="msgIn">Message <span style="color: var(--c-need-bar);" aria-hidden="true">*</span></label>
      <textarea id="msgIn" maxlength="300"
                placeholder="What's on the board?"
                spellcheck="false" aria-required="true" required></textarea>
      <div class="char-hint" id="msgHint" aria-live="polite"></div>
    </div>

  </div>

  <div class="expiry-row">
    <span class="expiry-label" id="expiryLabel">Expires:</span>
    <div role="group" aria-labelledby="expiryLabel" style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
      <button type="button" class="exp-btn" aria-pressed="false" onclick="setExpiry(24,  this)">1 day</button>
      <button type="button" class="exp-btn" aria-pressed="false" onclick="setExpiry(72,  this)">3 days</button>
      <button type="button" class="exp-btn active" aria-pressed="true" onclick="setExpiry(168, this)">1 week</button>
    </div>
    <button type="submit" class="post-btn" id="postBtn">POST</button>
  </div>
</form>

<div class="filter-bar">
  <span class="filter-label" id="filterLabel">Show:</span>
  <div role="group" aria-labelledby="filterLabel" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
    <button class="ftab active" aria-pressed="true" onclick="setFilter('',       this)">All</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Notice', this)">📌 Notice</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Offer',  this)">🌱 Offer</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Need',   this)">🤝 Need</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Event',  this)">📅 Event</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Review',  this)">📖 Review</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Recomm',   this)">💡 Recomm.</button>
    <button class="ftab" aria-pressed="false" onclick="setFilter('Request',  this)">🔍 Request</button>
  </div>
  <span class="sep"></span>
  <span class="filter-label" id="sortLabel">Sort:</span>
  <div role="group" aria-labelledby="sortLabel" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
    <button class="ftab active" id="sNew" aria-pressed="true" onclick="setSort('new', this)">New</button>
    <button class="ftab"        id="sExp" aria-pressed="false" onclick="setSort('exp', this)">Expiring</button>
  </div>
</div>

<div class="board" id="board"></div>

<footer class="site-footer">
  <span id="boardFooter"></span>
  <span id="uptimeDisplay">—</span>
</footer>

<script>
// First thing's first:
function updateBoardStatus(d) {
  const banner = document.getElementById('fullBanner');
  const btn    = document.getElementById('postBtn');
  if (d.full) {
    banner.style.display = 'block';
    if (btn) {
      btn.disabled = true;
      btn.title = "The board is currently full. Check back later.";
    }
  } else {
    banner.style.display = 'none';
    if (btn) {
      btn.disabled = false;
      btn.removeAttribute('title');
    }
  }
}
// ── XSS-safe escaping ──────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function timeLeft(expSecs) {
  const now  = Math.floor(Date.now() / 1000);
  const left = expSecs - now;
  if (left <= 0)      return { label: 'expired',   soon: true  };
  if (left < 3600)    return { label: Math.floor(left / 60) + 'm left',   soon: true  };
  if (left < 86400)   return { label: Math.floor(left / 3600) + 'h left', soon: left < 10800 };
  return { label: Math.floor(left / 86400) + 'd left', soon: false };
}

// ── State ──────────────────────────────────────
let currentType   = 'Notice';
let currentExpiry = 168;
let activeFilter  = '';
let activeSort    = 'new';

// ── Restore name from localStorage ────────────
const savedName = localStorage.getItem('cn_name');
if (savedName) {
  const nameInput = document.getElementById('nameIn');
  nameInput.value = savedName;
  const nameHint = document.getElementById('nameHint');
  nameHint.textContent = savedName.length + '/24';
  if (savedName.length > 20) nameHint.className = 'char-hint warn';
} else {
  document.getElementById('nameHint').textContent = '0/24';
}
document.getElementById('msgHint').textContent = '0/300';

document.getElementById('nameIn').addEventListener('input', function () {
  localStorage.setItem('cn_name', this.value);
  const h = document.getElementById('nameHint');
  const n = this.value.length;
  h.textContent = n + '/24';
  h.className   = 'char-hint' + (n > 20 ? ' warn' : '');
});

document.getElementById('msgIn').addEventListener('input', function () {
  const h = document.getElementById('msgHint');
  const n = this.value.length;
  h.textContent = n + '/300';
  h.className   = 'char-hint' + (n > 270 ? ' warn' : '');
});

document.getElementById('msgIn').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('postBtn').click(); }
});

// ── Category selection ─────────────────────────
function setType(t, btn) {
  currentType = t;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.className = 'cat-btn';
    b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('active-' + t);
  btn.setAttribute('aria-pressed', 'true');
}
// Set default active on load
document.querySelector('.cat-btn').classList.add('active-Notice');
document.querySelector('.cat-btn').setAttribute('aria-pressed', 'true');

// ── Expiry selection ───────────────────────────
function setExpiry(h, btn) {
  currentExpiry = h;
  document.querySelectorAll('.exp-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-pressed', 'true');
}

// ── Filter / sort ──────────────────────────────
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-bar .ftab').forEach(b => {
    if (b.id === 'sNew' || b.id === 'sExp') return;
    b.classList.remove('active');
    b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-pressed', 'true');
  if (lastData.length) render(lastData);
}

function setSort(s, btn) {
  activeSort = s;
  const sNew = document.getElementById('sNew');
  const sExp = document.getElementById('sExp');

  sNew.classList.toggle('active', s === 'new');
  sNew.setAttribute('aria-pressed', s === 'new' ? 'true' : 'false');

  sExp.classList.toggle('active', s === 'exp');
  sExp.setAttribute('aria-pressed', s === 'exp' ? 'true' : 'false');

  // ⚡ Bolt: Render locally instead of fetching from server to save 2 network requests
  if (lastData.length) render(lastData);
}

// ── Data ───────────────────────────────────────
let lastData = [];

async function loadSystemStatus() {
  try {
    const res = await fetch("/status");
    if (res.ok) {
      const data = await res.json();
      const errors = [];
      if (!data.sd_mounted) errors.push("Warning: SD Card not mounted.");
      if (!data.usb_mounted) errors.push("Warning: USB initialization failed.");
      if (!data.lora_initialized) errors.push("Warning: LoRaWAN initialization failed.");
      if (errors.length > 0) {
        const banner = document.getElementById("systemBanner");
        const list = document.getElementById("systemErrorsList");
        list.innerHTML = errors.map(e => `<li>${e}</li>`).join("");
        banner.style.display = "block";
      }
    }
  } catch (e) {
    console.error("Failed to load status", e);
  }
}


function render(data) {
  let filtered = activeFilter ? data.filter(m => m.type === activeFilter) : data;

  if (activeSort === 'exp') {
    filtered = [...filtered].sort((a, b) => a.expires - b.expires);
  }

  document.getElementById('postCount').textContent =
    data.length + ' post' + (data.length !== 1 ? 's' : '');

  const board = document.getElementById('board');

  if (filtered.length === 0) {
    board.innerHTML = '<div class="empty">Nothing here yet.<br>Be the first to post.</div>';
    return;
  }

  board.innerHTML = filtered.map(m => {
    const tl = timeLeft(m.expires);
    return `
<div class="card type-${esc(m.type)}">
  <div class="card-stripe"></div>
  <div class="card-body">
    <span class="cat-badge">${esc(m.type)}</span>
    <div class="card-text">${esc(m.text)}</div>
  </div>
  <div class="card-footer">
    <span class="card-author">${esc(m.author)}</span>
    <span class="card-expiry${tl.soon ? ' soon' : ''}">${tl.label}</span>
  </div>
</div>`;
  }).join('');
}

// ── Post ───────────────────────────────────────
async function doPost() {
  const n = document.getElementById('nameIn').value.trim() || 'neighbor';
  const t = document.getElementById('msgIn').value.trim();
  const hint = document.getElementById('msgHint');

  if (!t) {
    hint.textContent = 'Message is required to post.';
    hint.className = 'char-hint warn';
    document.getElementById('msgIn').focus();
    return;
  }

  const btn = document.getElementById('postBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'POSTING...';
    btn.title = "Post is currently being submitted...";
  }

  localStorage.setItem('cn_name', n);
  document.getElementById('nameIn').value = n;

  try {
    await fetch('/board/post', {
      method: 'POST',
      body: JSON.stringify({ author: n, type: currentType, text: t, expiry: currentExpiry })
    });

    document.getElementById('msgIn').value      = '';
    document.getElementById('msgHint').textContent = '';
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'POST';
      btn.removeAttribute('title');
    }
  }

  await runPolling();
}

// ── Board info ─────────────────────────────────
// ⚡ Bolt: Fetch board data sequentially to prevent connection pool exhaustion
// Board data is fetched from a single combined endpoint to prevent fetch waterfall latency
async function runPolling() {
  try {
    const r = await fetch('/board/all');
    const d = await r.json();

    // update info
    document.getElementById('boardTitle').textContent   = d.info.icon + '  ' + d.info.name;
    document.getElementById('boardTagline').textContent = d.info.tagline;
    document.getElementById('boardRules').textContent   = d.info.rules;
    document.getElementById('boardFooter').textContent  = d.info.footer;
    document.getElementById('uptimeDisplay').textContent = d.info.uptime;

    // update status
    updateBoardStatus(d.status);

    // update messages
    lastData = d.messages;
    render(lastData);
  } catch (e) {
    console.error('Failed to load board data', e);
  }

  await loadSystemStatus();
}

runPolling();
setInterval(runPolling, 60000);
</script>
<script>
    function toggleMenu() {
        const menu = document.getElementById('menuContent');
        const btn = document.querySelector('.menu-btn');
        const isExpanded = btn.getAttribute('aria-expanded') === 'true';
        menu.classList.toggle('show');
        btn.setAttribute('aria-expanded', !isExpanded);
    }
    window.onclick = function(event) {
        if (!event.target.matches('.menu-btn')) {
            var dropdowns = document.getElementsByClassName("menu-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                    document.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
                }
            }
        }
    }
</script>
