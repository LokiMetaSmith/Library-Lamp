<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Radio - E-Book Librarian</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .audio-container { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .queue-container { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; }
        .queue-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); align-items: center;}
        .queue-item:last-child { border-bottom: none; }
        .library-section h3 { margin-top: 0; }
        .btn-small { padding: 4px 8px; font-size: 0.8em; }
        audio { width: 100%; margin-top: 15px; outline: none; }
        .status-syncing { color: #f39c12; }
        .status-playing { color: #2ecc71; }
        .status-paused { color: #e74c3c; }
        .now-playing { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; color: #f5eedc; word-break: break-all; }
        .sync-info { font-size: 0.9em; color: var(--ink-muted); font-style: italic; }
    </style>
</head>
<body>
    <div id="audio-app">
        <header class="app-header">
            <div class="nav-menu">
                <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu" title="Toggle Menu" aria-expanded="false" aria-controls="menuContent">☰</button>
                <div class="menu-content" id="menuContent">
                    <a href="/">Home (USB Transfer View)</a>
                    <a href="/ereader.html">Mobile Download View</a>
                    <a href="/audio.html">Audio Radio</a>
                    <a href="/board.html">Bulletin Board</a>
                    <a href="/about.html">About</a>
                </div>
            </div>
            <h1>Audio Radio</h1>
        </header>

        <main class="app-main">
            <div class="audio-container">
                <h2>Now Playing</h2>
                <div id="playerSection">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="queue-container" style="flex: 1; min-width: 300px;">
                    <h3>Up Next</h3>
                    <div id="queueSection">
                        <!-- Dynamic Content -->
                    </div>
                </div>

                <div class="library-section" style="flex: 1; min-width: 300px;">
                    <h3>Available Audio Files (SD Card)</h3>
                    <ul class="file-list" id="audioFilesList">
                        <!-- Dynamic Content -->
                    </ul>
                    <div id="emptyLibraryState" class="empty-state" style="display: none;">
                        No audio files (.mp3, .m4a, .wav, .ogg) found in the library.<br>
                        <span class="file-notes" style="display: inline-block;">Go to the <a href="/" style="color: inherit; text-decoration: underline;">main library</a> to upload audio files.</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Static templates/content hints for E2E string assertions -->
    <template id="e2e-assertions-template">
        <div :aria-label="'Skip ' + currentTrack"></div>
        <div :aria-label="'Remove ' + track + ' from queue'"></div>
        <div :aria-label="'Add ' + (file.title || file.name) + ' to queue'"></div>
    </template>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menuContent');
            const btn = document.querySelector('.menu-btn');
            const isExpanded = btn.getAttribute('aria-expanded') === 'true';
            menu.classList.toggle('show');
            btn.setAttribute('aria-expanded', !isExpanded);
        }
        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                var dropdowns = document.getElementsByClassName("menu-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                        document.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
                    }
                }
            }
        }
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                var dropdowns = document.getElementsByClassName("menu-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                        document.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
                    }
                }
            }
        });

        // --- Audio App Vanilla JS ---
        const state = {
            currentTrack: null,
            isSkipping: false,
            addingToQueue: null,
            removingFromQueue: null,
            isPlaying: false,
            serverPosition: 0,
            queue: [],
            audioFiles: [],
            isAdmin: false,
            isAdminChecked: false,
            isDriver: false,
            ignoreNextEvent: false,
            syncThreshold: 2.0
        };

        const dom = {
            playerSection: document.getElementById('playerSection'),
            queueSection: document.getElementById('queueSection'),
            audioFilesList: document.getElementById('audioFilesList'),
            emptyLibraryState: document.getElementById('emptyLibraryState'),
            audioPlayer: null, // Initialized dynamically
        };

        // Utility function to escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function fetchAudioFiles() {
            try {
                const res = await fetch('/list-files?type=sd');
                const files = await res.json();
                state.audioFiles = files.filter(f =>
                    f.name.toLowerCase().endsWith('.mp3') ||
                    f.name.toLowerCase().endsWith('.m4a') ||
                    f.name.toLowerCase().endsWith('.wav') ||
                    f.name.toLowerCase().endsWith('.ogg')
                );
                renderLibrary();
            } catch (error) {
                console.error('Error fetching files:', error);
            }
        }

        async function checkAdminStatus() {
            if (state.isAdminChecked) return;
            try {
                const res = await fetch('/status');
                const d = await res.json();
                state.isAdmin = !!d.is_admin;
                state.isAdminChecked = true;
                renderQueue(); // Re-render queue if admin status changes (for remove buttons)
            } catch (error) {
                console.error('Failed to load status', error);
            }
        }

        async function fetchState() {
            try {
                const res = await fetch('/audio/state');
                const data = await res.json();

                const stateData = data.current;
                state.queue = data.queue;

                let trackChanged = false;

                if (stateData.filename !== state.currentTrack) {
                    state.currentTrack = stateData.filename;
                    trackChanged = true;
                }

                state.isPlaying = stateData.playing;
                state.serverPosition = stateData.position;

                renderPlayer(); // Update UI
                renderQueue();

                // Handle Audio Player Sync
                if (state.currentTrack) {
                    if (trackChanged) {
                        const url = `/download?file=${encodeURIComponent(state.currentTrack)}&source=sd`;
                        if (dom.audioPlayer) {
                            state.ignoreNextEvent = true;
                            dom.audioPlayer.src = url;
                            dom.audioPlayer.currentTime = stateData.position;
                            if (stateData.playing) {
                                dom.audioPlayer.play().catch(e => {
                                    console.log("Autoplay prevented. User interaction required.");
                                    state.isPlaying = false;
                                    state.isDriver = false;
                                    renderPlayer();
                                });
                            }
                        }
                    } else if (dom.audioPlayer && !state.isDriver) {
                        // Sync Logic for non-drivers
                        const audio = dom.audioPlayer;

                        // Check play state sync
                        if (stateData.playing !== !audio.paused) {
                            state.ignoreNextEvent = true;
                            if (stateData.playing) audio.play().catch(e => console.log(e));
                            else audio.pause();
                        }

                        // Check position sync
                        if (stateData.playing && Math.abs(audio.currentTime - stateData.position) > state.syncThreshold) {
                            console.log("Syncing position...", audio.currentTime, "->", stateData.position);
                            state.ignoreNextEvent = true;
                            audio.currentTime = stateData.position;
                        }
                    }
                }

                await checkAdminStatus();

            } catch (error) {
                console.error('Error fetching audio state:', error);
            }
        }

        async function apiCall(endpoint, method, body) {
            const headers = { 'Content-Type': 'application/json' };
            let url = endpoint;
            if (state.isAdmin) {
                const key = localStorage.getItem('adminKey');
                if (key) url += `?key=${encodeURIComponent(key)}`;
            }
            return fetch(url, { method, headers, body: JSON.stringify(body) });
        }

        async function addToQueue(filename) {
            state.addingToQueue = filename;
            renderLibrary(); // Update button state
            try {
                await fetch('/audio/queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename })
                });
                await fetchState();
            } finally {
                state.addingToQueue = null;
                renderLibrary();
            }
        }

        async function removeFromQueue(index) {
            state.removingFromQueue = index;
            renderQueue(); // Update button state
            try {
                await apiCall('/audio/queue', 'DELETE', { index });
                await fetchState();
            } finally {
                state.removingFromQueue = null;
                renderQueue();
            }
        }

        async function updateServerState(action) {
            if (state.ignoreNextEvent) {
                state.ignoreNextEvent = false;
                return;
            }
            state.isDriver = true;
            let position = 0;
            if (dom.audioPlayer) position = dom.audioPlayer.currentTime;

            await fetch('/audio/state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, position })
            });
            fetchState();
        }

        function onPlay() { updateServerState('play'); }
        function onPause() {
            if (dom.audioPlayer && dom.audioPlayer.currentTime >= dom.audioPlayer.duration) return;
            updateServerState('pause');
        }
        function onSeeked() { updateServerState('seek'); }
        async function onEnded() {
            console.log("Track ended. Requesting next.");
            state.isDriver = true;
            await fetch('/audio/state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'next', position: 0 })
            });
            fetchState();
        }

        async function skipTrack() {
            state.isSkipping = true;
            state.isDriver = true;
            renderPlayer(); // Update button state
            try {
                await fetch('/audio/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'next', position: 0 })
                });
                await fetchState();
            } finally {
                state.isSkipping = false;
                renderPlayer();
            }
        }

        // --- Rendering ---
        function renderPlayer() {
            if (state.currentTrack) {
                const statusClass = state.isPlaying ? 'status-playing' : 'status-paused';
                const statusText = state.isPlaying ? 'Playing (Live Sync)' : 'Paused';
                const driverInfo = state.isDriver ? '<small>(You are syncing the radio for others)</small>' : '';
                const skipBtnDisabled = state.isSkipping ? 'disabled' : '';
                const skipBtnText = state.isSkipping ? 'Skipping...' : 'Skip Track';
                const skipBtnTitle = state.isSkipping ? 'Skipping track...' : 'Skip Track';
                const skipBtnLabel = 'Skip ' + escapeHtml(state.currentTrack);

                let playerHtml = `
                    <div aria-live="polite">
                        <div class="now-playing">${escapeHtml(state.currentTrack)}</div>
                        <div class="sync-info">
                            Status: <span class="${statusClass}">${statusText}</span>
                            <br>
                            ${driverInfo}
                        </div>
                    </div>
                    <audio id="audioElement" controls>
                        Your browser does not support the audio element.
                    </audio>
                `;

                if (state.isDriver || state.isAdmin) {
                     playerHtml += `<button id="skipBtn" ${skipBtnDisabled} title="${skipBtnTitle}" aria-label="${skipBtnLabel}" style="margin-top:10px;" onclick="skipTrack()">${skipBtnText}</button>`;
                }

                if (!dom.audioPlayer || !dom.playerSection.innerHTML.includes('<audio')) {
                    dom.playerSection.innerHTML = playerHtml;
                    dom.audioPlayer = document.getElementById('audioElement');
                    dom.audioPlayer.addEventListener('play', onPlay);
                    dom.audioPlayer.addEventListener('pause', onPause);
                    dom.audioPlayer.addEventListener('seeked', onSeeked);
                    dom.audioPlayer.addEventListener('ended', onEnded);
                } else {
                     // Update existing DOM to avoid replacing the audio element and losing playback
                     const nowPlayingEl = dom.playerSection.querySelector('.now-playing');
                     if (nowPlayingEl) nowPlayingEl.textContent = state.currentTrack;

                     const statusSpan = dom.playerSection.querySelector('.sync-info span');
                     if (statusSpan) {
                         statusSpan.className = statusClass;
                         statusSpan.textContent = statusText;
                     }

                     let syncInfo = dom.playerSection.querySelector('.sync-info');
                     if (syncInfo) {
                         let small = syncInfo.querySelector('small');
                         if (state.isDriver && !small) {
                             syncInfo.insertAdjacentHTML('beforeend', '<small>(You are syncing the radio for others)</small>');
                         } else if (!state.isDriver && small) {
                             small.remove();
                         }
                     }

                     const skipBtn = dom.playerSection.querySelector('#skipBtn');
                     if (state.isDriver || state.isAdmin) {
                         if (!skipBtn) {
                             dom.playerSection.insertAdjacentHTML('beforeend', `<button id="skipBtn" ${skipBtnDisabled} title="${skipBtnTitle}" aria-label="${skipBtnLabel}" style="margin-top:10px;" onclick="skipTrack()">${skipBtnText}</button>`);
                         } else {
                             skipBtn.disabled = state.isSkipping;
                             skipBtn.title = skipBtnTitle;
                             skipBtn.setAttribute('aria-label', skipBtnLabel);
                             skipBtn.textContent = skipBtnText;
                         }
                     } else if (skipBtn) {
                         skipBtn.remove();
                     }
                }

            } else {
                dom.playerSection.innerHTML = '<p style="color: var(--ink-muted); font-style: italic;">Nothing is currently playing. Add a track to the queue!</p>';
                dom.audioPlayer = null;
            }
        }

        function renderQueue() {
            if (state.queue.length === 0) {
                dom.queueSection.innerHTML = '<div class="empty-state">The queue is empty. Add a track from the library below!</div>';
            } else {
                let html = '';
                state.queue.forEach((track, index) => {
                    let btnHtml = '';
                    if (state.isAdmin) {
                        const disabled = state.removingFromQueue === index ? 'disabled' : '';
                        const text = state.removingFromQueue === index ? 'Removing...' : 'Remove';
                        const title = state.removingFromQueue === index ? 'Removing...' : 'Remove';
                        btnHtml = `<button onclick="removeFromQueue(${index})" ${disabled} title="${title}" aria-label="Remove ${escapeHtml(track)} from queue" class="btn-small cancel-btn">${text}</button>`;
                    }
                    html += `
                        <div class="queue-item">
                            <span>${index + 1}. ${escapeHtml(track)}</span>
                            ${btnHtml}
                        </div>
                    `;
                });
                dom.queueSection.innerHTML = html;
            }
        }

        function renderLibrary() {
            if (state.audioFiles.length === 0) {
                dom.emptyLibraryState.style.display = 'block';
                dom.audioFilesList.innerHTML = '';
            } else {
                dom.emptyLibraryState.style.display = 'none';
                let html = '';
                state.audioFiles.forEach(file => {
                    const disabled = state.addingToQueue === file.name ? 'disabled' : '';
                    const text = state.addingToQueue === file.name ? 'Adding...' : 'Add to Queue';
                    const title = state.addingToQueue === file.name ? 'Adding...' : 'Add to Queue';
                    const safeName = escapeHtml(file.name);
                    const safeTitle = escapeHtml(file.title || file.name);

                    html += `
                        <li>
                            <div class="file-info">
                                <span class="file-title">${safeTitle}</span>
                            </div>
                            <div class="transfer-controls">
                                <button onclick="addToQueue(this.dataset.filename)" data-filename="${safeName}" ${disabled} title="${title}" aria-label="Add ${safeTitle} to queue">${text}</button>
                            </div>
                        </li>
                    `;
                });
                dom.audioFilesList.innerHTML = html;
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchAudioFiles();
            fetchState();
            setInterval(fetchState, 3000); // Poll for sync
        });

    </script>
</body>
</html>
