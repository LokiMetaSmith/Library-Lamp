[env:esp32s3_devkitc_1]
platform = espressif32
board = esp32s3_devkitc_1
framework = espidf

; --- Source and Library Paths ---
; Point PlatformIO to the 'main' directory for source files
src_dir = main

; --- Dependencies ---
; Include the local sqlite3 library
lib_extra_dirs = sqlite3

; --- Filesystem ---
; Specify the directory for the SPIFFS image.
; This will be uploaded when using "Upload File System image".
data_dir = main/web_assets

; --- Serial Monitor ---
monitor_speed = 115200

; --- Build Configuration ---
; Use the custom partition table
board_build.partitions = partitions.csv

; Embed web assets directly into the binary, similar to EMBED_FILES in CMake.
; This is used for the captive portal setup page.
board_build.embed_txtfiles =
    main/web_assets/index.html
    main/web_assets/script.js
    main/web_assets/style.css
    main/web_assets/setup.html
