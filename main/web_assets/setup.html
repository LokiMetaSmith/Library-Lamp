<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Book Librarian - Wi-Fi Setup</title>
    <style>
        :root {
            --bg: #352920;
            --surface: #3f3127;
            --surface2: #4a382a;
            --border: #5a4634;
            --border-light: #7a5f47;
            --ink: #e8dbce;
            --ink-muted: #d1bfae;
            --accent: #ffcc80;
            --accent-dark: #8c5a35;
            --radius: 12px;
            --c-need-bar: #c4813a;
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; background-color: var(--bg); color: var(--ink); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .container { max-width: 400px; width: 100%; padding: 30px; background-color: var(--surface2); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 20px rgba(255, 180, 100, 0.15); text-align: center; }
        h1 { color: var(--accent); margin-top: 0; margin-bottom: 20px; font-weight: 600; }
        p { color: var(--ink-muted); margin-bottom: 30px; line-height: 1.4; }
        .file-notes { font-size: 0.9em; margin-top: -20px; margin-bottom: 25px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 3px solid var(--accent-dark); }
        .file-notes strong { color: var(--accent); }
        label { display: block; text-align: left; margin-bottom: 6px; font-weight: 500; color: var(--ink); margin-left: 5%; }
        input[type="text"], input[type="password"] { width: 90%; padding: 12px; margin-bottom: 20px; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: var(--ink); font-size: 1em; box-sizing: border-box; transition: border-color 0.2s, box-shadow 0.2s; }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 204, 128, 0.2); }
        input::placeholder { color: #887a6c; }
        button { background-color: var(--accent-dark); color: var(--ink); border: 1px solid var(--border-light); padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1.1em; font-weight: 500; width: 90%; transition: all 0.2s ease; box-sizing: border-box; margin: 0 auto; display: block; }
        button:hover { background-color: var(--border-light); color: #fff; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .btn-secondary { background-color: var(--surface); margin-top: 15px; }
        .btn-secondary:hover { background-color: var(--border); }
        .status-message { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 6px; width: 90%; margin-left: auto; margin-right: auto; }
        .success { background-color: rgba(40, 167, 69, 0.2); color: #85d496; border: 1px solid rgba(40, 167, 69, 0.3); }
        .error { background-color: rgba(220, 53, 69, 0.2); color: #ff8a80; border: 1px solid rgba(220, 53, 69, 0.3); }
        @keyframes loadingDots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
        .loading-dots::after { content: ""; animation: loadingDots 1.5s infinite steps(1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wi-Fi Setup</h1>
        <p>Connect your E-Book Librarian to your local Wi-Fi network.</p>
        <p class="file-notes">
            Note: Connecting to Wi-Fi enables automatic syncing with the global <strong>Playnet Community Bulletin Board</strong>, while keeping your local E-Book offline network active.
        </p>
        <form action="/save-credentials" method="POST" novalidate onsubmit="const ssidIn = document.getElementById('ssid'); if (!ssidIn.value.trim()) { const stat = document.getElementById('status'); stat.textContent = 'Please enter a Wi-Fi Network Name (SSID).'; stat.className = 'status-message error'; ssidIn.focus(); return false; } const btn = this.querySelector('button[type=submit]'); btn.disabled = true; btn.innerHTML = 'Connecting<span class=\'loading-dots\'></span>'; return true;">
            <div style="margin-bottom: 15px;">
                <label for="ssid">Wi-Fi Network Name (SSID) <span aria-hidden="true" style="color: var(--c-need-bar);">*</span></label>
                <input type="text" id="ssid" name="ssid" placeholder="e.g., MyHomeNetwork" required style="margin-bottom: 0;">
            </div>
            <div style="margin-bottom: 20px; margin-top: 20px;">
                <label for="password">Password</label>
                <div style="display: flex; gap: 8px; width: 90%; margin: 0 auto;">
                    <input type="password" id="password" name="password" placeholder="e.g., MySecretPassword" style="margin-bottom: 0; width: 100%;">
                    <button type="button" class="btn-secondary" onclick="const p = document.getElementById('password'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; const label = isPass ? 'Hide password' : 'Show password'; this.textContent = isPass ? 'Hide' : 'Show'; this.setAttribute('aria-pressed', isPass); this.setAttribute('aria-label', label); this.title = label;" aria-label="Show password" title="Show password" aria-pressed="false" style="width: 80px; padding: 0; margin: 0; font-size: 0.9em; flex-shrink: 0;">Show</button>
                </div>
            </div>
            <button type="submit">Connect</button>
        </form>
        <div aria-live="polite" aria-atomic="true">
            <div id="status" style="display: none;"></div>
        </div>
        <button type="button" class="btn-secondary" onclick="window.location.href='/index.html'">Back to Library</button>
    </div>
</body>
</html>
