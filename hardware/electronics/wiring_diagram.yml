# To render this diagram, use the WireViz tool:
# pip install wireviz
# wireviz wiring_diagram.yml

# --- Define Connectors and Devices ---

connectors:
  esp32s3_devkit:
    type: pin-header
    # Pins on the ESP32-S3-DevKitC-1 board used in this project
    pins: [3V3, 5V, GND, IO0, IO2, IO3, IO4, IO5, IO6, IO7, IO8, IO9, IO11, IO12, IO13, IO14, IO48]
    pin_labels:
      3V3: [3V3.1, 3V3.2] # For connecting multiple 3V3 lines
      GND: [GND.1, GND.2, GND.3, GND.4] # For connecting multiple grounds

  sd_module:
    type: pin-header
    # Pins on a standard SPI MicroSD card module
    pins: [VCC, GND, CS, SCK, DI, DO]
    pin_labels:
      DI: MOSI
      DO: MISO

  led_strip:
    type: pin-header
    # Pins on a standard WS2812B/NeoPixel strip
    pins: [GND, "Data In", VCC]

  button:
    type: pushbutton
    # A standard 2-pin tactile pushbutton
    pins: [1, 2]

  lora_module:
    type: pin-header
    # Pins on a standard LoRa module (like Wio-SX1262)
    pins: [3V3, GND, SCK, MISO, MOSI, CS, RST, BUSY, DIO1, DIO2]

# --- Define Wires and Connections ---

wires:
  # --- Power Connections ---
  - connect:
      - esp32s3_devkit: [3V3.1, GND.1]
      - sd_module: [VCC, GND]
    color: [RD, BK] # Red for 3.3V, Black for Ground

  - connect:
      - esp32s3_devkit: [3V3.2, GND.4]
      - lora_module: [3V3, GND]
    color: [RD, BK] # Red for 3.3V, Black for Ground
    
  - connect:
      - esp32s3_devkit: [5V, GND.2]
      - led_strip: [VCC, GND]
    color: [RD, BK] # Red for 5V, Black for Ground

  - connect:
      - esp32s3_devkit: [IO0, GND.3]
      - button: [1, 2]
    color: [GN, BK] # Green for signal, Black for Ground

  # --- SD Card (SPI) Connections ---
  - connect:
      - esp32s3_devkit: [IO11]
      - sd_module: [CS]
    color: YL # Yellow
    
  - connect:
      - esp32s3_devkit: [IO12]
      - sd_module: [SCK]
    color: BU # Blue

  - connect:
      - esp32s3_devkit: [IO14]
      - sd_module: [DO] # MISO
    color: GN # Green

  - connect:
      - esp32s3_devkit: [IO13]
      - sd_module: [DI] # MOSI
    color: OG # Orange
    
  # --- LED Strip Connection ---
  - connect:
      - esp32s3_devkit: [IO48]
      - led_strip: ["Data In"]
    color: WT # White

  # --- LoRa (SPI & Control) Connections ---
  - connect:
      - esp32s3_devkit: [IO5]
      - lora_module: [CS]
    color: YL # Yellow

  - connect:
      - esp32s3_devkit: [IO7]
      - lora_module: [SCK]
    color: BU # Blue

  - connect:
      - esp32s3_devkit: [IO8]
      - lora_module: [MISO]
    color: GN # Green

  - connect:
      - esp32s3_devkit: [IO9]
      - lora_module: [MOSI]
    color: OG # Orange

  - connect:
      - esp32s3_devkit: [IO3]
      - lora_module: [RST]
    color: WH # White

  - connect:
      - esp32s3_devkit: [IO4]
      - lora_module: [BUSY]
    color: GY # Grey

  - connect:
      - esp32s3_devkit: [IO2]
      - lora_module: [DIO1]
    color: VT # Violet

  - connect:
      - esp32s3_devkit: [IO6]
      - lora_module: [DIO2]
    color: PK # Pink
