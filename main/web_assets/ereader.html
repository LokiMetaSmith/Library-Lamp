<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Book Library</title>
    <style>
        body {
            font-family: "Georgia", "Times New Roman", serif;
            margin: 0;
            padding: 10px;
            background: #2b211a;
            color: #e8dbce;
        }
        h1 {
            text-align: center;
            font-size: 1.8em;
            color: #ffcc80;
            text-shadow: 0 0 10px rgba(255, 204, 128, 0.4);
            border-bottom: 2px solid #5a4634;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .book-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-width: 600px;
            margin: 0 auto;
        }
        .book-item {
            margin-bottom: 15px;
            padding: 15px;
            background-color: #3f3127;
            border: 1px solid #5a4634;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 15px rgba(255, 180, 100, 0.1);
        }
        .book-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-decoration: none;
            color: #ffcc80;
        }
        .book-title:hover {
            color: #ffe0b2;
            text-shadow: 0 0 5px rgba(255, 204, 128, 0.5);
        }
        .book-author {
            font-size: 1em;
            color: #d1bfae;
            font-style: italic;
        }
        .book-notes {
            font-size: 0.9em;
            color: #a89f91;
            margin-top: 8px;
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #ffcc80;
        }
        .error {
            color: #ff8a80;
            text-align: center;
            background-color: #3a2220;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #5a2a25;
            max-width: 600px;
            margin: 0 auto;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9em;
            color: #8a7b6c;
            padding-bottom: 20px;
        }
        .admin-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: #8c5a35;
            border: 1px solid #5a3820;
            text-decoration: none;
            color: #f5eedc;
            border-radius: 6px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .admin-link:hover {
            background-color: #a06b43;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 8px rgba(255, 204, 128, 0.4);
        }
    </style>
</head>
<body>

    <h1>E-Book Library</h1>

<div id="systemBanner" style="display:none;background:#8a6a24;color:#f5eedc;padding:10px;margin: 0 auto 20px auto;border-radius:5px;border:1px solid #a88532;font-size:0.9em;max-width:600px;box-shadow: 0 0 10px rgba(255, 200, 50, 0.2);">
    <ul id="systemErrorsList" style="margin:0;padding-left:20px;"></ul>
</div>
    <div id="loading" class="loading">Loading books...</div>
    <div id="error" class="error" style="display: none;"></div>

    <ul id="book-list" class="book-list">
        <!-- Books will be inserted here -->
    </ul>

    <div class="footer">
        Direct Download Interface<br>
        <a href="/" class="admin-link">Switch to Admin View</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchBooks();
        loadSystemStatus();
        });

        async function loadSystemStatus() {
            try {
                const res = await fetch("/status");
                if (res.ok) {
                    const data = await res.json();
                    const errors = [];
                    if (!data.sd_mounted) errors.push("Warning: SD Card not mounted.");
                    if (!data.usb_mounted) errors.push("Warning: USB initialization failed.");
                    if (!data.lora_initialized) errors.push("Warning: LoRaWAN initialization failed.");
                    if (errors.length > 0) {
                        const banner = document.getElementById("systemBanner");
                        const list = document.getElementById("systemErrorsList");
                        list.innerHTML = errors.map(e => `<li>${e}</li>`).join("");
                        banner.style.display = "block";
                    }
                }
            } catch (e) {
                console.error("Failed to load status", e);
            }
        }
        async function fetchBooks() {
            try {
                const response = await fetch('/list-files?type=sd');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const books = await response.json();
                renderBooks(books);
            } catch (error) {
                console.error('Error fetching books:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Failed to load books. Please refresh the page.';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderBooks(books) {
            const listElement = document.getElementById('book-list');
            const loadingElement = document.getElementById('loading');

            listElement.innerHTML = ''; // Clear existing
            loadingElement.style.display = 'none';

            if (books.length === 0) {
                listElement.innerHTML = '<li class="book-item" style="text-align: center; color: #a89f91;">No books found in the library.</li>';
                return;
            }

            // Sort books alphabetically by title
            books.sort((a, b) => a.title.localeCompare(b.title));

            books.forEach(book => {
                const li = document.createElement('li');
                li.className = 'book-item';

                const titleLink = document.createElement('a');
                titleLink.className = 'book-title';
                titleLink.textContent = book.title;
                // Link directly to the download endpoint
                titleLink.href = `/download?file=${encodeURIComponent(book.name)}&source=sd`;

                li.appendChild(titleLink);

                if (book.name.toLowerCase().endsWith('.epub')) {
                    const readLink = document.createElement('a');
                    readLink.href = `/viewer.html?file=${encodeURIComponent(book.name)}&source=sd`;
                    readLink.className = 'admin-link';
                    readLink.style.marginLeft = '10px';
                    readLink.style.padding = '4px 8px';
                    readLink.textContent = 'Read Online';
                    li.appendChild(readLink);
                }

                if (book.author) {
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'book-author';
                    authorDiv.textContent = `by ${book.author}`;
                    li.appendChild(authorDiv);
                }

                if (book.notes) {
                    const notesDiv = document.createElement('div');
                    notesDiv.className = 'book-notes';
                    notesDiv.textContent = book.notes;
                    li.appendChild(notesDiv);
                }

                listElement.appendChild(li);
            });
        }
    </script>
</body>
</html>
