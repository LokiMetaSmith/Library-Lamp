<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Download View</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding-top: 10px;
        }
        h1 {
            border: none;
            margin-top: 40px;
        }
        .book-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-width: 600px;
            margin: 0 auto;
        }
        .book-item {
            margin-bottom: 15px;
            padding: 15px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 15px rgba(255, 180, 100, 0.1);
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: var(--accent);
        }
        .error {
            color: #ff8a80;
            text-align: center;
            background-color: #3a2220;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #5a2a25;
            max-width: 600px;
            margin: 0 auto;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9em;
            color: var(--ink-muted);
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <header class="app-header" style="max-width: 600px; border: none; box-shadow: none; background: transparent; padding: 0;">
        <div class="nav-menu">
            <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu" aria-expanded="false" aria-controls="menuContent">☰</button>
            <div class="menu-content" id="menuContent">
                <a href="/">Home (USB Transfer View)</a>
                <a href="/ereader.html">Mobile Download View</a>
                <a href="/audio.html">Audio Radio</a>
                <a href="/board.html">Bulletin Board</a>
                <a href="/about.html">About</a>
            </div>
        </div>
        <h1>Mobile Download View</h1>
    </header>

<div id="systemBanner" style="display:none;background:#8a6a24;color:#f5eedc;padding:10px;margin: 0 auto 20px auto;border-radius:5px;border:1px solid #a88532;font-size:0.9em;max-width:600px;box-shadow: 0 0 10px rgba(255, 200, 50, 0.2);">
    <ul id="systemErrorsList" style="margin:0;padding-left:20px;"></ul>
</div>
    <div id="loading" class="loading">Loading books...</div>
    <div id="error" class="error" style="display: none;"></div>

    <ul id="book-list" class="book-list">
        <!-- Books will be inserted here -->
    </ul>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menuContent');
            const btn = document.querySelector('.menu-btn');
            const isExpanded = btn.getAttribute('aria-expanded') === 'true';
            menu.classList.toggle('show');
            btn.setAttribute('aria-expanded', !isExpanded);
        }
        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                var dropdowns = document.getElementsByClassName("menu-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                        document.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchBooks();
            loadSystemStatus();
        });

        async function loadSystemStatus() {
            try {
                const res = await fetch("/status");
                if (res.ok) {
                    const data = await res.json();
                    const errors = [];
                    if (!data.sd_mounted) errors.push("Warning: SD Card not mounted.");
                    if (!data.usb_mounted) errors.push("Warning: USB initialization failed.");
                    if (!data.lora_initialized) errors.push("Warning: LoRaWAN initialization failed.");
                    if (errors.length > 0) {
                        const banner = document.getElementById("systemBanner");
                        const list = document.getElementById("systemErrorsList");
                        list.innerHTML = errors.map(e => `<li>${e}</li>`).join("");
                        banner.style.display = "block";
                    }
                }
            } catch (e) {
                console.error("Failed to load status", e);
            }
        }
        async function fetchBooks() {
            try {
                const response = await fetch('/list-files?type=sd');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const books = await response.json();
                renderBooks(books);
            } catch (error) {
                console.error('Error fetching books:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Failed to load books. Please refresh the page.';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderBooks(books) {
            const listElement = document.getElementById('book-list');
            const loadingElement = document.getElementById('loading');

            listElement.innerHTML = ''; // Clear existing
            loadingElement.style.display = 'none';

            if (books.length === 0) {
                listElement.innerHTML = '<li class="empty-state">No books found in the library.<br><span style="font-size: 0.9em; margin-top: 5px; display: inline-block;">Go to the <a href="/" style="color: inherit; text-decoration: underline;">main library</a> to upload books.</span></li>';
                return;
            }

            // Sort books alphabetically by title
            books.sort((a, b) => a.title.localeCompare(b.title));

            books.forEach(book => {
                const li = document.createElement('li');
                li.className = 'book-item';

                const titleLink = document.createElement('a');
                titleLink.className = 'book-title';
                titleLink.textContent = book.title;
                // Link directly to the download endpoint
                titleLink.href = `/download?file=${encodeURIComponent(book.name)}&source=sd`;
                titleLink.style.display = 'block';
                titleLink.style.marginBottom = '5px';
                titleLink.style.textDecoration = 'none';
                titleLink.style.fontSize = '1.3em';
                titleLink.style.fontWeight = 'bold';
                titleLink.style.color = 'var(--accent)';

                li.appendChild(titleLink);

                if (book.name.toLowerCase().endsWith('.epub')) {
                    const readLink = document.createElement('a');
                    readLink.href = `/viewer.html?file=${encodeURIComponent(book.name)}&source=sd`;
                    readLink.className = 'admin-link';
                    readLink.style.marginLeft = '10px';
                    readLink.style.padding = '4px 8px';
                    readLink.setAttribute('aria-label', `Read ${book.title} online`);
                    readLink.textContent = 'Read Online';
                    li.appendChild(readLink);
                }

                if (book.author) {
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'book-author';
                    authorDiv.textContent = `by ${book.author}`;
                    authorDiv.style.fontStyle = 'italic';
                    authorDiv.style.color = 'var(--ink-muted)';
                    li.appendChild(authorDiv);
                }

                if (book.notes) {
                    const notesDiv = document.createElement('div');
                    notesDiv.className = 'book-notes';
                    notesDiv.textContent = book.notes;
                    notesDiv.style.fontSize = '0.9em';
                    notesDiv.style.color = 'var(--border-light)';
                    notesDiv.style.marginTop = '8px';
                    li.appendChild(notesDiv);
                }

                listElement.appendChild(li);
            });
        }
    </script>
</body>
</html>
